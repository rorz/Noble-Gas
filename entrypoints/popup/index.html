<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noble Gas</title>
    <link rel="icon" type="image/png" href="/icon/32.png" />
  </head>
  <body>
    <header class="titlebar"><img src="/icon/32.png" width="16" height="16" alt="" /><span>Noble Gas</span></header>
    <main>
      <button type="button" id="rewrite" class="nt-button" disabled>Deslop</button>
      <fieldset class="rewrite-options" id="rewrite-options" aria-label="Rewrite options" disabled>
        <label class="option-row" for="thinking-level"><span>Thinking level</span><span class="select-control"><select id="thinking-level"><option value="low" selected>Low</option><option value="medium">Medium</option><option value="high">High</option></select></span></label>
        <label class="check-row" for="web-search"><input id="web-search" type="checkbox" checked /><span>Enable web search</span></label>
      </fieldset>
      <details class="key-accordion" id="key-accordion">
        <summary><span id="key-label">Set API key</span></summary>
        <form id="key-form">
          <label for="api-key" class="form-label">Gemini API key</label>
          <div class="key-row"><input class="field" id="api-key" type="password" placeholder="Paste your key" autocomplete="off" spellcheck="false" maxlength="512" required /><button class="nt-button" id="save-key" type="submit">Save</button></div>
          <button type="button" id="forget-key" class="nt-button" hidden>Remove key</button>
        </form>
      </details>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
